<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>HelpBot Widget — Halaman Uji</title>
  </head>
  <body>
    <h1>Halaman Uji Widget HelpBot</h1>
    <p>
      Halaman HTML statis terpisah dari aplikasi Next.js — membuktikan
      widget bisa dipasang di situs manapun cukup dengan tag
      <code>&lt;script&gt;</code>.
    </p>
    <p>
      Tambahkan <code>?chatbotId=ID_BOT_KAMU</code> di URL untuk menguji
      dengan chatbot tertentu. Klik bubble di pojok kanan bawah untuk mulai
      chat.
    </p>

    <script>
      var params = new URLSearchParams(window.location.search);
      var chatbotId = params.get("chatbotId") || "REPLACE_WITH_CHATBOT_ID";
      var s = document.createElement("script");
      s.src = window.location.origin + "/widget.js";
      s.setAttribute("data-chatbot-id", chatbotId);
      s.async = true;
      document.body.appendChild(s);
    </script>
  </body>
</html>
